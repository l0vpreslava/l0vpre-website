[project]
name = "website"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "l0vpreslava", email = "l0vpreslava@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.1",
    "fastapi[standard]>=0.115.12",
    "jinja2>=3.1.6",
    "minio>=7.2.15",
    "sqlalchemy>=2.0.41",
    "uvicorn>=0.34.2",
]

[project.scripts]
website = "website:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "black>=25.1.0",
    "mypy>=1.15.0",
]
